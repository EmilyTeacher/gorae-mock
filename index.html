<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자이스토리 M 빈칸 | 고래영어 모의고사 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2740; --ink-soft:#4A5E73; --line:#D6E2EC;
  --bg:#F3F7FA; --paper:#FFFFFF; --sea:#2C6BA8; --sea-wash:#E4EEF7;
  --mark:#FFE27A; --mark-ink:#5A4300; --ok:#1E7D5A;
  --r-s:#2C6BA8; --r-v:#C2410C; --r-o:#1E7D5A; --r-mod:#C9D5E0;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:#F3F7FA !important;color:#0F2740}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:4px}

.crumb{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13px;color:var(--ink-soft);margin:0 0 18px;padding:0;list-style:none}
.crumb li+li::before{content:"›";margin-right:6px;color:var(--line)}
.crumb li:last-child{color:var(--ink);font-weight:600}

.hero h1{font-size:28px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em}
.hero p{margin:0;color:var(--ink-soft);font-size:15px}
.blank-demo{display:inline-block;width:72px;height:.9em;background:var(--mark);vertical-align:-2px;border-radius:2px;margin:0 2px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.row:hover .row-title{color:var(--sea)}
.row-no{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--sea)}
.row-title{font-weight:600;font-size:16px;line-height:1.4}
.row-meta{font-size:13px;color:var(--ink-soft)}
.row-state{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.row-state.ready{color:var(--ok);font-weight:600}

/* detail */
.back{background:none;border:0;padding:6px 0;color:var(--sea);font-size:15px;margin-bottom:8px}
.d-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.d-no{font-family:var(--serif);font-size:56px;line-height:.9;font-weight:600;color:var(--sea)}
.d-title{font-size:21px;font-weight:700;line-height:1.35;margin:0}
.d-meta{font-size:13px;color:var(--ink-soft);margin:6px 0 0}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;background:var(--bg);margin:20px -18px 0;padding:8px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-size:15px;color:var(--ink-soft)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--sea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.panel{padding-top:22px}
.panel h3{font-size:17px;margin:26px 0 10px}
.panel h3:first-child{margin-top:0}
.bg-list{margin:0;padding-left:1.1em}
.bg-list li{margin-bottom:10px}

.tools{display:flex;justify-content:flex-end;margin-bottom:8px}
.toggle{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px}
.vocab{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vocab li{padding:12px 0;border-bottom:1px solid var(--line)}
.v-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-word{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.35}
.v-type{font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--sea-wash);color:var(--sea)}
.v-type.ph{background:var(--mark);color:var(--mark-ink)}
.v-mean{display:block;font-weight:600;margin-top:4px}
.v-easy{display:block;font-size:14px;color:var(--ink-soft)}
.v-more{display:block;font-size:13px;color:var(--sea)}
.hide-mean .v-mean,.hide-mean .v-easy,.hide-mean .v-more{filter:blur(6px);user-select:none}
.hide-mean li:active .v-mean,.hide-mean li:active .v-easy{filter:none}
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--sea);padding:0;margin-left:auto}
.spk svg{width:18px;height:18px;pointer-events:none}
.spk.on{background:var(--sea);color:var(--paper);border-color:var(--sea)}
.s-full .spk{margin:0 0 0 8px;vertical-align:-10px;width:30px;height:30px}
.v-filter{display:flex;gap:6px}
.sent{list-style:none;margin:0;padding:0}
.sent>li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:18px}
.s-full{font-family:var(--serif);font-size:17px;line-height:1.7;margin:0 0 14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.s-num{display:inline-block;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--paper);background:var(--sea);border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;margin-right:8px;vertical-align:2px}
.chunks{list-style:none;margin:0;padding:0}
.chunks li{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 0 9px 12px;border-left:4px solid var(--r-mod);margin-bottom:6px}
.chunks li[data-r="s"]{border-left-color:var(--r-s)}
.chunks li[data-r="v"]{border-left-color:var(--r-v)}
.chunks li[data-r="o"]{border-left-color:var(--r-o)}
.chunks li[data-r="c"]{border-left-color:var(--mark)}
.c-en{font-family:var(--serif);font-size:18px;line-height:1.45}
.c-kr{font-size:15px;color:var(--ink-soft)}
.c-role{font-size:12px;font-weight:700;margin-right:6px}
.chunks li[data-r="s"] .c-role{color:var(--r-s)}
.chunks li[data-r="v"] .c-role{color:var(--r-v)}
.chunks li[data-r="o"] .c-role{color:var(--r-o)}
.chunks li[data-r="m"] .c-role{color:var(--ink-soft)}
.chunks li[data-r="c"] .c-role{color:var(--mark-ink);background:var(--mark);padding:0 5px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-soft);margin:0 0 16px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.point{background:var(--sea-wash);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.point b{display:block;font-size:13px;color:var(--sea);margin-bottom:2px}
.natural{margin-top:12px;font-size:15px}
.natural b{font-size:13px;color:var(--ink-soft);margin-right:6px}
.blank{display:inline-block;min-width:80px;background:var(--mark);height:1em;vertical-align:-2px;border-radius:2px}

.flow{list-style:none;margin:0;padding:0}
.flow>li{position:relative;padding:0 0 22px 28px}
.flow>li::before{content:"";position:absolute;left:5px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--sea)}
.flow>li::after{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:1px;background:var(--line)}
.flow>li:last-child::after{display:none}
.flow>li.key::before{background:var(--mark);box-shadow:0 0 0 2px var(--mark-ink)}
.f-label{display:inline-block;font-size:13px;font-weight:700;color:var(--sea);margin-bottom:4px}
.flow>li.key .f-label{color:var(--mark-ink);background:var(--mark);padding:0 6px;border-radius:3px}
.f-en{font-family:var(--serif);font-size:17px;line-height:1.65}
.f-en mark{background:none;color:inherit;border-bottom:3px solid var(--mark);font-weight:600}
.f-why{font-size:14px;color:var(--ink-soft);margin-top:4px}
.f-kr{font-size:15px;line-height:1.6;margin-top:6px;color:var(--ink)}
.f-why{border-top:1px dashed var(--line);padding-top:4px}
.tip{background:var(--sea-wash);border-radius:10px;padding:14px 16px;font-size:15px;margin-top:6px}
.answer-btn{width:100%;border:2px dashed var(--line);background:var(--paper);border-radius:10px;padding:16px;font-size:16px;font-weight:600;margin-top:18px}
.answer{background:var(--paper);border:2px solid var(--ok);border-radius:10px;padding:16px;margin-top:18px}
.answer b{color:var(--ok)}
.answer .a-en{font-family:var(--serif);font-size:17px;margin:4px 0}
.next{display:block;width:100%;margin-top:14px;border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:14px;font-size:15px;font-weight:600}

@media (max-width:520px){
  .wrap{padding:16px 14px 56px}
  .tabs{margin:20px -14px 0;padding:6px 14px 0}
  .tab{padding:10px 10px;font-size:14.5px}
  .sent>li{padding:14px 12px;border-radius:10px}
  .s-full{font-size:16px;line-height:1.65}
  .chunks li{padding:7px 0 7px 10px;margin-bottom:4px;border-left-width:3px}
  .c-role{display:block;font-size:11.5px;margin:0 0 1px}
  .c-en{font-size:16.5px;line-height:1.4}
  .c-kr{font-size:14px}
  .point,.natural{font-size:14.5px}
  .legend{font-size:12px;gap:4px 10px}
  .f-en{font-size:16px}
  .d-no{font-size:46px}
}
.howto{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 16px}
.howto summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"+";font-size:20px;color:var(--sea);font-weight:400}
.howto[open] summary::after{content:"–"}
.howto ol{margin:0;padding:0 0 16px 1.2em}
.howto li{margin-bottom:8px;font-size:15px}
.howto li b{color:var(--sea)}
.core{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);margin-bottom:8px}
.core div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.core div:last-child{border-bottom:0}
.core dt{font-weight:700;color:var(--sea);margin:0}
.core dd{margin:0}
.core .en{font-family:var(--serif);font-size:16px;display:block}
.core .gist{background:var(--sea-wash)}
.q-stem{font-weight:600;margin:0 0 10px}
.q-line{font-family:var(--serif);font-size:17px;line-height:1.7;background:var(--paper);border-radius:10px;padding:14px;border:1px solid var(--line);margin:0 0 6px}
.q-note{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.choices{list-style:none;margin:0;padding:0}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font-family:var(--serif);font-size:16.5px;line-height:1.45}
.choice .n{font-family:var(--sans);font-weight:700;color:var(--sea);flex:none}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.choice.wrong{border-color:var(--r-v);background:color-mix(in srgb,var(--r-v) 8%,var(--paper))}
.choice:disabled{cursor:default;color:var(--ink)}
.feedback{border-radius:10px;padding:14px 16px;margin-top:6px;font-size:15px}
.feedback.ok{background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.feedback.no{background:color-mix(in srgb,var(--r-v) 10%,var(--paper))}
.feedback b{display:block;margin-bottom:4px}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.wrong-list{list-style:none;margin:0;padding:0}
.wrong-list li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:15px}
.wrong-list .w-head{font-weight:700;margin-bottom:2px}
.wrong-list .w-head span{color:var(--r-v);margin-right:6px}
.quiz{list-style:none;margin:0;padding:0}
.quiz>li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.quiz .qq{font-weight:600;margin:0 0 10px}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quiz .opt{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:14.5px;text-align:left}
.quiz .opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper));font-weight:600}
.quiz .opt.wrong{border-color:var(--r-v);text-decoration:line-through}
.score{text-align:center;background:var(--paper);border:2px solid var(--sea);border-radius:12px;padding:18px;margin-top:8px}
.score strong{display:block;font-size:30px;color:var(--sea);font-family:var(--serif)}
.q-secs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.q-secs::-webkit-scrollbar{display:none}
.q-cnt{font-size:12px;opacity:.75;margin-left:2px}
.g-q{font-family:var(--serif);font-size:16.5px;font-weight:400;line-height:1.6}
.g-opt{font-family:var(--serif);font-size:16px;text-align:center}
.opts.tf{grid-template-columns:1fr 1fr}
.opt.ox{font-size:22px;font-weight:700;text-align:center;padding:8px}
.opt.ox.wrong{text-decoration:none;opacity:.6}
.why{font-size:14px;color:var(--ink-soft);margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.why b{color:var(--ok)}
.w-slot{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px;background:var(--bg)}
.w-slot.ok{border-style:solid;border-color:var(--ok)}
.w-slot.no{border-style:solid;border-color:var(--r-v)}
.w-ph{font-size:13px;color:var(--ink-soft);padding-left:4px}
.w-bank{display:flex;flex-wrap:wrap;gap:6px}
.w-chip{font-family:var(--serif);font-size:16px;line-height:1.3;border:1.5px solid var(--sea);color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 11px;text-align:left}
.w-chip.in{background:var(--sea-wash)}
.w-chip:disabled{cursor:default}
.btn:disabled{opacity:.4;cursor:default}
@media (max-width:520px){.quiz .opts{grid-template-columns:1fr}.opts.tf{grid-template-columns:1fr 1fr}.q-secs{margin:0 -14px 14px;padding:0 14px}}
.qz-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--sea);margin-top:4px}
.qz-bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 14px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--sea);border-radius:3px;transition:width .2s}
.qz-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 16px;box-shadow:0 2px 10px rgba(15,39,64,.06)}
.qz-hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px}
.qz-q{font-size:18px;font-weight:700;line-height:1.5;margin:0 0 16px}
.qz-opts{display:grid;gap:10px}
.qz-opts.two{grid-template-columns:1fr 1fr}
.qz-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:16.5px;line-height:1.4;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);min-height:54px}
.qz-opt:not(:disabled):hover{border-color:var(--sea)}
.qz-n{flex:none;font-weight:700;color:var(--sea);font-size:18px}
.qz-opt.big{justify-content:center;font-family:var(--serif);font-size:20px;font-weight:600}
.qz-opt.ox{justify-content:center;font-size:30px;font-weight:700;padding:10px}
.qz-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.qz-opt.right::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:700;font-size:20px}
.qz-opt.big.right::after,.qz-opt.ox.right::after{margin-left:8px}
.qz-opt.wrong{border-color:var(--r-v);background:color-mix(in srgb,var(--r-v) 12%,var(--paper))}
.qz-opt.wrong::after{content:"✕";margin-left:auto;color:var(--r-v);font-weight:700;font-size:18px}
.qz-opt.big.wrong::after,.qz-opt.ox.wrong::after{margin-left:8px}
.qz-opt.dim{opacity:.45}
.qz-opt:disabled{cursor:default}
.g-sent{font-family:var(--serif);font-size:20px;line-height:2;margin:0 0 18px}
.gbox{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:8px;padding:0 10px;background:var(--mark);color:var(--mark-ink);font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.8;white-space:nowrap}
.gbox i{font-style:normal;opacity:.5}
.gbox.filled.ok{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border-color:var(--ok);color:var(--ink)}
.gbox.filled.no{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border-color:var(--ok);color:var(--ink)}
.fb{border-radius:14px;padding:16px;margin-top:12px;font-size:15.5px;line-height:1.6;border:2px solid}
.fb p{margin:0 0 8px}.fb p:last-child{margin-bottom:0}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--paper))}
.fb.no{border-color:var(--r-v);background:color-mix(in srgb,var(--r-v) 7%,var(--paper))}
.fb-t{font-size:17px;font-weight:700}
.fb.ok .fb-t{color:var(--ok)}.fb.ok .fb-t::before{content:"✓ "}
.fb.no .fb-t{color:var(--r-v)}.fb.no .fb-t::before{content:"✕ "}
.fb b{color:var(--ink)}
.fb-en{font-family:var(--serif);font-size:16.5px;background:var(--paper);border-left:4px solid var(--mark);padding:8px 10px;border-radius:0 6px 6px 0}
.qz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.qz-nav .btn{flex:1;padding:14px}
.w-chip.pos-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.w-chip.pos-no{border-color:var(--r-v);background:color-mix(in srgb,var(--r-v) 12%,var(--paper))}
.w-hint{background:var(--sea-wash);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14.5px}
.w-hint b{color:var(--sea)}
.w-ans{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.w-a{display:inline-flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--sea);border-radius:8px;padding:6px 10px;font-family:var(--serif);font-size:16px}
.w-r{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--sea)}
.sc-rows{display:grid;gap:6px;margin:12px auto;max-width:260px;text-align:left}
.sc-rows div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}

function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google|Jenny|Aria/i.test(v.name))||vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text, btn){
  if(!("speechSynthesis" in window)){ alert("이 기기에서는 발음 듣기가 지원되지 않아요."); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.85; if(voice) u.voice=voice;
  document.querySelectorAll(".spk.on").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on"); u.onend=u.onerror=()=>btn.classList.remove("on");
  speechSynthesis.speak(u);
}

function shuffle(n,seed){
  const a=[...Array(n).keys()]; let x=seed*7+3;
  for(let i=n-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.every((v,i)=>v===i)) a.reverse();
  return a;
}

  } else if(state.tab==="solve"){
    const q=p.question, picked=state.pick;
    body = `<p class="q-stem">${esc(q.stem)}</p>
     <p class="q-line">${q.line}</p>
     <p class="q-note">교재에서 지문을 끝까지 읽고 골라 보세요.</p>
     <ul class="choices">${q.choices.map((c,i)=>{
        let cls=""; if(picked!==null){ if(i===q.correct) cls="right"; else if(i===picked) cls="wrong"; }
        return `<li><button class="choice ${cls}" data-pick="${i}" ${picked!==null?"disabled":""}><span class="n">${NUM[i]}</span><span>${esc(c)}</span></button></li>`;}).join("")}</ul>
     ${picked===null?"":(picked===q.correct
       ? `<div class="feedback ok"><b>정답이에요!</b>근거 문장과 다른 선택지가 왜 틀렸는지도 확인해 보세요.</div>
          <div class="row-btns"><button class="btn" data-tab="flow">흐름·정답 보기</button></div>`
       : `<div class="feedback no"><b>아쉬워요. 정답은 ${NUM[q.correct]}번이에요.</b>근거 문장을 다시 보면 왜 ${NUM[q.correct]}번인지 보여요.</div>
          <div class="row-btns"><button class="btn" data-tab="flow">근거 문장 보러 가기</button><button class="btn ghost" id="retry">다시 풀기</button></div>`)}`;
  } else if(state.tab==="flow"){
    const c=p.core;
    body = `<h3>글의 핵심</h3>
     <dl class="core">
       <div><dt>소재</dt><dd>${esc(c.material)}</dd></div>
       <div><dt>화제</dt><dd>${esc(c.topic)}</dd></div>
       <div><dt>주제</dt><dd><span class="en">${esc(c.themeEn)}</span>${esc(c.themeKr)}</dd></div>
       <div class="gist"><dt>요지</dt><dd>${esc(c.gist)}</dd></div>
     </dl>
     <h3>정답의 근거가 되는 문장</h3>
     <ol class="flow">${p.flow.map(f=>`<li class="${f.key?"key":""}"><span class="f-label">${f.label}</span><div class="f-en">${f.en}</div><div class="f-kr">${esc(f.kr)}</div><div class="f-why">${esc(f.why)}</div></li>`).join("")}</ol>
     <div class="tip"><b>빈칸 팁</b> ${esc(p.tip)}</div>
     ${(state.showAns||state.pick!==null)
       ? `<div class="answer"><b>정답 ${p.answer.no}</b><div class="a-en">${esc(p.answer.en)}</div><div>${esc(p.answer.kr)}</div></div>
          <h3>오답은 왜 틀렸을까</h3>
          <ul class="wrong-list">${p.wrong.map(w=>`<li><div class="w-head"><span>${w[0]}</span>${esc(w[1])}</div>${esc(w[2])}</li>`).join("")}</ul>
          <div class="row-btns"><button class="btn" data-tab="quiz">확인 퀴즈 풀기</button></div>`
       : `<button class="answer-btn" id="ans">정답과 오답 분석 보기</button>`}`;
  } else if(state.tab==="quiz"){
    const Q=p.quiz, A=state.qa;
    const SECS=[["vocab","어휘·구"],["grammar","어법"],["tf","내용 일치"],["write","라이팅"]];
    const n=k=>Q[k].length;
    const answered=(k,i)=>k==="write"?!!(A.write[i]&&A.write[i].done):A[k][i]!==undefined;
    const isRight=(k,i)=>k==="write"?!!(A.write[i]&&A.write[i].ok):A[k][i]===Q[k][i].a;
    const doneN=k=>Q[k].filter((_,i)=>answered(k,i)).length;
    const rightN=k=>Q[k].filter((_,i)=>answered(k,i)&&isRight(k,i)).length;
    const all=SECS.every(([k])=>doneN(k)===n(k));
    const sec=state.qsec, i=state.qi[sec], x=Q[sec][i], got=A[sec][i];
    const NUMS=["①","②","③","④"];
    let card="", fb="";

    if(sec==="vocab"){
      card=`<p class="qz-q">${esc(x.q)}</p><div class="qz-opts">${x.o.map((o,j)=>{
        let c=""; if(got!==undefined){ c=j===x.a?"right":(j===got?"wrong":"dim"); }
        return `<button class="qz-opt ${c}" data-ans="${j}" ${got!==undefined?"disabled":""}><span class="qz-n">${NUMS[j]}</span>${esc(o)}</button>`;}).join("")}</div>`;
      if(got!==undefined) fb = got===x.a
        ? `<div class="fb ok"><p class="fb-t">정답이에요</p><p>${esc(x.why)}</p></div>`
        : `<div class="fb no"><p class="fb-t">아쉬워요. 정답은 ${NUMS[x.a]} ${esc(x.o[x.a])}</p><p><b>내가 고른 ${NUMS[got]}</b> ${esc(x.e[got])}</p><p><b>정답 ${NUMS[x.a]}의 이유</b> ${esc(x.why)}</p></div>`;
    } else if(sec==="grammar"){
      const box = got===undefined
        ? `<span class="gbox"><span>${esc(x.o[0])}</span><i>/</i><span>${esc(x.o[1])}</span></span>`
        : `<span class="gbox filled ${got===x.a?"ok":"no"}">${esc(x.o[x.a])}</span>`;
      card=`<p class="qz-hint">네모 안에서 어법상 알맞은 것을 고르세요.</p>
        <p class="g-sent">${esc(x.pre)} ${box} ${esc(x.post)}</p>
        <div class="qz-opts two">${x.o.map((o,j)=>{
          let c=""; if(got!==undefined){ c=j===x.a?"right":(j===got?"wrong":"dim"); }
          return `<button class="qz-opt big ${c}" data-ans="${j}" ${got!==undefined?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
      if(got!==undefined) fb = got===x.a
        ? `<div class="fb ok"><p class="fb-t">정답이에요</p><p>${esc(x.why)}</p></div>`
        : `<div class="fb no"><p class="fb-t">아쉬워요. 정답은 ${esc(x.o[x.a])}</p><p><b>내가 고른 ${esc(x.o[got])}</b> ${esc(x.wrong)}</p><p><b>정답 ${esc(x.o[x.a])}의 이유</b> ${esc(x.why)}</p></div>`;
    } else if(sec==="tf"){
      card=`<p class="qz-hint">글의 내용과 일치하면 O, 일치하지 않으면 X</p><p class="qz-q">${esc(x.s)}</p>
        <div class="qz-opts two">${[true,false].map(v=>{
          let c=""; if(got!==undefined){ c=v===x.a?"right":(v===got?"wrong":"dim"); }
          return `<button class="qz-opt ox ${c}" data-ans="${v}" ${got!==undefined?"disabled":""}>${v?"O":"X"}</button>`;}).join("")}</div>`;
      if(got!==undefined) fb=`<div class="fb ${got===x.a?"ok":"no"}"><p class="fb-t">${got===x.a?"정답이에요":"아쉬워요. 정답은 "+(x.a?"O":"X")}</p>
        <p><b>지문 근거</b></p><p class="fb-en">${esc(x.en)}</p><p>${esc(x.kr)}</p>
        ${x.a?"":`<p><b>그래서</b> 문제의 내용은 지문과 달라요.</p>`}</div>`;
    } else {
      const st=A.write[i]||(A.write[i]={pick:[],checked:false,ok:false,done:false,hint:false,order:shuffle(x.c.length,i+p.no.length)});
      const show=j=>j===0?x.c[j].charAt(0).toLowerCase()+x.c[j].slice(1):x.c[j];
      const placed=st.pick.map((j,k)=>{
        let c="in"; if(st.checked) c+= (j===k?" pos-ok":" pos-no");
        const txt=k===0?x.c[j].charAt(0).toUpperCase()+x.c[j].slice(1):show(j);
        return `<button class="w-chip ${c}" data-out="${k}" ${st.checked?"disabled":""}>${esc(txt)}</button>`;}).join("");
      card=`<p class="qz-hint">우리말에 맞게 덩어리를 눌러 순서대로 놓으세요. 놓은 덩어리를 누르면 빠져요.</p>
        <p class="qz-q">${esc(x.kr)}</p>
        <div class="w-slot ${st.checked?(st.ok?"ok":"no"):""}">${placed||'<span class="w-ph">여기에 덩어리를 놓으세요</span>'}</div>
        ${st.done?"":`<div class="w-bank">${st.order.map(j=>st.pick.includes(j)?"":`<button class="w-chip" data-in="${j}">${esc(show(j))}</button>`).join("")}</div>`}
        ${st.hint&&!st.done?`<div class="w-hint"><b>힌트</b> ${esc(x.hint)}</div>`:""}
        ${st.done?"":`<div class="row-btns">
           <button class="btn" data-wchk ${st.pick.length===x.c.length&&!st.checked?"":"disabled"}>확인</button>
           ${st.hint?"":`<button class="btn ghost" data-whint>힌트 보기</button>`}
           ${st.pick.length&&!st.checked?`<button class="btn ghost" data-wclr>처음부터</button>`:""}</div>`}`;
      if(st.checked&&!st.ok&&!st.done) fb=`<div class="fb no"><p class="fb-t">아쉬워요. 빨간 덩어리의 자리가 틀렸어요</p><p><b>순서 힌트</b> ${esc(x.hint)}</p>
         <div class="row-btns"><button class="btn" data-wretry>틀린 것만 다시 놓기</button><button class="btn ghost" data-wgive>정답 보기</button></div></div>`;
      if(st.done) fb=`<div class="fb ${st.ok?"ok":"no"}"><p class="fb-t">${st.ok?"정확해요":"정답 문장"}</p>
         <div class="w-ans">${x.c.map((c,j)=>`<span class="w-a"><span class="w-r">${esc(x.r[j])}</span>${esc(c)}</span>`).join("")}</div>
         <p><b>포인트</b> ${esc(x.point)}</p></div>`;
    }
    const last=i===n(sec)-1, si=SECS.findIndex(s=>s[0]===sec), nextSec=SECS[si+1];
    const nav=`<div class="qz-nav">
       <button class="btn ghost" data-qprev ${i===0?"disabled":""}>이전</button>
       ${!last?`<button class="btn" data-qnext ${answered(sec,i)?"":"disabled"}>다음 문제</button>`
         :nextSec&&!all?`<button class="btn" data-qsec="${nextSec[0]}" ${answered(sec,i)?"":"disabled"}>다음: ${nextSec[1]}</button>`
         :all?`<button class="btn" data-qresult>결과 보기</button>`:`<span></span>`}</div>`;
    const result=state.qres&&all?`<div class="score"><strong>${SECS.reduce((t,[k])=>t+rightN(k),0)} / ${SECS.reduce((t,[k])=>t+n(k),0)}</strong>
       <div class="sc-rows">${SECS.map(([k,l])=>`<div><span>${l}</span><b>${rightN(k)} / ${n(k)}</b></div>`).join("")}</div>
       ${SECS.every(([k])=>rightN(k)===n(k))?`<p>${p.no} 학습 완료! 모두 맞았어요.</p>`:`<p>점수가 낮은 영역을 다시 풀어 보세요.</p>`}
       <div class="row-btns" style="justify-content:center"><button class="btn ghost" id="requiz">퀴즈 다시 풀기</button></div></div>`:"";
    body=`<div class="q-secs" role="group" aria-label="퀴즈 영역">${SECS.map(([k,l])=>`<button class="chip" aria-pressed="${k===sec&&!state.qres}" data-qsec="${k}">${l}<span class="q-cnt">${doneN(k)}/${n(k)}</span></button>`).join("")}</div>
      ${result || `<div class="qz-top"><span>${SECS[si][1]}</span><span>${i+1} / ${n(sec)}</span></div>
      <div class="qz-bar"><i style="width:${(i+1)/n(sec)*100}%"></i></div>
      <div class="qz-card">${card}</div>${fb}${nav}`}`;
  }
  app.innerHTML = `
   ${crumb(p.no)}
   <button class="back" id="back">‹ 지문 목록</button>
   <div class="d-head"><span class="d-no">${p.no}</span></div>
   <h2 class="d-title">${esc(p.title)}</h2>
   <p class="d-meta">${p.topic} · ${p.src} · 교재 지문을 펴 놓고 함께 보세요</p>
   ${p.bg?`<div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab" role="tab" aria-selected="${t[0]===state.tab}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`:""}
   <section class="panel" role="tabpanel">${body}</section>`;
}

function render(){ state.open ? renderDetail() : renderList(); }

app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.say!==undefined){ say(t.dataset.say,t); return; }
  if(t.dataset.pick!==undefined){ state.pick=+t.dataset.pick; render(); return; }
  if(state.tab==="quiz"&&state.open){
    const sec=state.qsec, i=state.qi[sec], A=state.qa, st=A.write[i];
    const go=()=>{ render(); };
    if(t.dataset.ans!==undefined){ const v=t.dataset.ans; A[sec][i]= sec==="tf"?(v==="true"):+v; return go(); }
    if(t.dataset.qsec){ state.qsec=t.dataset.qsec; state.qres=false; return go(); }
    if(t.dataset.qnext!==undefined){ state.qi[sec]++; return go(); }
    if(t.dataset.qprev!==undefined){ state.qi[sec]--; return go(); }
    if(t.dataset.qresult!==undefined){ state.qres=true; return go(); }
    if(t.dataset.in!==undefined){ st.pick.push(+t.dataset.in); return go(); }
    if(t.dataset.out!==undefined){ st.pick.splice(+t.dataset.out,1); return go(); }
    if(t.dataset.whint!==undefined){ st.hint=true; return go(); }
    if(t.dataset.wclr!==undefined){ st.pick=[]; return go(); }
    if(t.dataset.wchk!==undefined){ st.checked=true; st.ok=st.pick.every((v,k)=>v===k); if(st.ok) st.done=true; return go(); }
    if(t.dataset.wretry!==undefined){ st.pick=st.pick.filter((v,k)=>v===k&&st.pick.slice(0,k+1).every((w,m)=>w===m)); st.checked=false; st.tried=true; return go(); }
    if(t.dataset.wgive!==undefined){ st.pick=Object.keys(st.pick).map(Number); st.done=true; st.ok=false; return go(); }
  }
  if(t.id==="retry"){ state.pick=null; render(); return; }
  if(t.id==="requiz"){ state.qa=freshQA(); state.qsec="vocab"; state.qi=freshQI(); state.qres=false; render(); window.scrollTo(0,0); return; }
  if(t.dataset.vf){ state.vf=t.dataset.vf; render(); return; }
  if(t.dataset.topic){ state.topic=t.dataset.topic; render(); }
  else if(t.dataset.open){ state.open=t.dataset.open; state.tab="bg"; state.showAns=false; state.pick=null; state.qa=freshQA(); state.qsec="vocab"; state.qi=freshQI(); state.qres=false; render(); window.scrollTo(0,0); }
  else if(t.id==="back"){ state.open=null; render(); }
  else if(t.dataset.tab){ if("speechSynthesis" in window) speechSynthesis.cancel(); state.tab=t.dataset.tab; render(); window.scrollTo(0,0); }
  else if(t.id==="hide"){ state.hide=!state.hide; render(); }
  else if(t.id==="ans"){ state.showAns=true; render(); }
});
render();
</script>
</body>
</html>
